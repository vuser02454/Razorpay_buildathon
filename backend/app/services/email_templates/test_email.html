<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ subject }}</title>
</head>
<body style="margin: 0; padding: 32px 16px; background-color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #0f172a; -webkit-font-smoothing: antialiased;">
  <table width="100%" border="0" cellspacing="0" cellpadding="0" style="max-width: 580px; margin: 0 auto; background-color: #ffffff; border-radius: 20px; overflow: hidden; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);">
    
    <!-- Brand Header -->
    <tr>
      <td style="background-color: #030712; padding: 26px 32px; border-bottom: 1px solid #1e293b;">
        <table width="100%" border="0" cellspacing="0" cellpadding="0">
          <tr>
            <td>
              <div style="font-size: 18px; font-weight: 900; color: #ffffff; letter-spacing: -0.5px; text-transform: uppercase;">
                ⚡ {{ merchant_name }}
              </div>
              <div style="font-size: 11px; color: #94a3b8; font-family: monospace; margin-top: 3px;">
                System Diagnostic Test &bull; Mail Delivery Gateway
              </div>
            </td>
            <td align="right">
              <span style="display: inline-block; background-color: #042f2e; color: #2dd4bf; font-size: 10px; font-family: monospace; font-weight: 700; padding: 4px 10px; border-radius: 9999px; text-transform: uppercase;">
                Mail Service Active
              </span>
            </td>
          </tr>
        </table>
      </td>
    </tr>

    <!-- Body Content -->
    <tr>
      <td style="padding: 36px 32px;">
        
        <h1 style="margin: 0 0 16px 0; font-size: 22px; font-weight: 800; color: #0f172a; line-height: 1.3;">
          {{ headline }}
        </h1>

        <p style="font-size: 15px; line-height: 1.6; color: #334155; margin: 0 0 16px 0;">
          Hi <strong>{{ customer_name }}</strong>,
        </p>

        <p style="font-size: 14px; line-height: 1.65; color: #475569; margin: 0 0 24px 0;">
          {{ body }}
        </p>

        <!-- Diagnostic Summary Box -->
        <table width="100%" border="0" cellspacing="0" cellpadding="0" style="background-color: #f0fdfa; border: 1px solid #ccfbf1; border-radius: 14px; margin-bottom: 28px;">
          <tr>
            <td style="padding: 20px;">
              <table width="100%" border="0" cellspacing="0" cellpadding="0">
                <tr>
                  <td>
                    <div style="font-size: 11px; font-family: monospace; font-weight: 700; color: #0f766e; text-transform: uppercase;">
                      Delivery Protocol
                    </div>
                    <div style="font-size: 14px; font-family: monospace; font-weight: 800; color: #115e59; margin-top: 4px;">
                      Secure Transactional Mail Relay
                    </div>
                  </td>
                  <td align="right">
                    <div style="font-size: 11px; font-family: monospace; font-weight: 700; color: #0f766e; text-transform: uppercase;">
                      Status
                    </div>
                    <div style="font-size: 13px; font-family: monospace; color: #0f766e; font-weight: 800; margin-top: 4px;">
                      ✓ OPERATIONAL
                    </div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>

        <div style="text-align: center; margin: 24px 0;">
          <a href="{{ payment_update_url }}" style="display: inline-block; background-color: #0f766e; color: #ffffff; padding: 13px 32px; border-radius: 9999px; text-decoration: none; font-weight: 700; font-size: 13px;">
            {{ cta_text }} &rarr;
          </a>
        </div>

      </td>
    </tr>

    <!-- Footer -->
    <tr>
      <td style="background-color: #f8fafc; padding: 22px 32px; border-top: 1px solid #e2e8f0; font-size: 11px; color: #94a3b8; text-align: center; line-height: 1.6;">
        Powered by <strong>RecoverAI</strong> &bull; Non-intrusive Autonomous Recovery
      </td>
    </tr>

  </table>
</body>
</html>
